<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection · Hamsafar</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f766e; color: #fff; }
      main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .logo { width: 88px; height: 88px; border-radius: 22px; background: rgba(255,255,255,.12); display: grid; place-items: center; margin: 0 auto 24px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0 auto 28px; max-width: 300px; color: #ccfbf1; line-height: 1.45; }
      button { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 14px; padding: 14px 32px; background: #f59e0b; color: #0f172a; }
      button:active { transform: scale(.98); }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="logo" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.57"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
        </div>
        <h1>No internet connection</h1>
        <p>Hamsafar needs the internet to show rides. Check your mobile data or Wi-Fi, then try again.</p>
        <button type="button" onclick="location.href = 'https://hamsafar.website/'">Try again</button>
      </div>
    </main>
  </body>
</html>
